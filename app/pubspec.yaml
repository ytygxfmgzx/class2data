name: class2data
description: "课小记 — 家庭课外班账本和成长档案"
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 路由
  go_router: ^14.8.1

  # 数据库
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.28

  # 工具
  uuid: ^4.5.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  path: ^1.9.1
  collection: ^1.19.1

  # 本地通知
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # 文件操作
  archive: ^4.0.4
  share_plus: ^10.0.0
  file_picker: ^9.0.0

  # UI
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.2
  package_info_plus: ^9.0.1
  device_info_plus: ^12.4.0
  http: ^1.6.0
  shared_preferences: ^2.5.5

  # WebDAV 云端备份
  xml: ^6.5.0
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 代码生成
  build_runner: ^2.4.14
  drift_dev: ^2.24.0
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.1
  riverpod_lint: ^2.6.3

  # Lint
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  image_path: assets/branding/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: assets/branding/app_icon.png
    icon_size: 48
