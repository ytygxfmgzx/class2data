<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>课小记 · 成长 Feed v3</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px;color:#1a1a1a;background:#1a1a2e;
  display:flex;justify-content:center;align-items:center;min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
#root{display:flex;justify-content:center;align-items:center}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.bootcdn.net/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">

const { useState, useMemo } = React;

// ═══════════════════════════════════════════════════════════════
// iOS Frame (from ios_frame.jsx)
// ═══════════════════════════════════════════════════════════════

const iosFrameStyles = {
  wrapper:{display:'inline-block',padding:12,background:'#000',borderRadius:60,boxShadow:'0 0 0 2px #1f2937, 0 20px 60px rgba(0,0,0,0.3)',position:'relative'},
  screen:{position:'relative',borderRadius:48,overflow:'hidden',background:'#fff'},
  statusBar:{position:'absolute',top:0,left:0,right:0,height:54,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 32px',fontSize:16,fontWeight:600,fontFamily:'-apple-system,"SF Pro Text",sans-serif',zIndex:20,pointerEvents:'none'},
  dynamicIsland:{position:'absolute',top:12,left:'50%',transform:'translateX(-50%)',width:124,height:36,background:'#000',borderRadius:999,zIndex:30},
  statusIcons:{display:'flex',alignItems:'center',gap:6},
  signalIcon:{display:'flex',alignItems:'flex-end',gap:2,height:12},
  signalBar:{width:3,background:'currentColor',borderRadius:1},
  batteryIcon:{width:26,height:12,border:'1.5px solid currentColor',borderRadius:3,padding:1,position:'relative',opacity:0.8},
  batteryCap:{position:'absolute',top:3,right:-3,width:2,height:6,background:'currentColor',borderRadius:'0 1px 1px 0'},
  content:{position:'absolute',top:54,left:0,right:0,bottom:34,overflow:'auto',WebkitOverflowScrolling:'touch'},
  homeIndicator:{position:'absolute',bottom:10,left:'50%',transform:'translateX(-50%)',width:140,height:5,background:'rgba(0,0,0,0.3)',borderRadius:999,zIndex:10},
};

function IosFrame({children,width=393,height=852,time='9:41',battery=100}){
  const tc='#000';
  return(
    <div style={iosFrameStyles.wrapper}>
      <div style={{...iosFrameStyles.screen,width,height,background:'#f5f5f5'}}>
        <div style={{...iosFrameStyles.statusBar,color:tc}}>
          <span>{time}</span>
          <div style={iosFrameStyles.statusIcons}>
            <div style={iosFrameStyles.signalIcon}>
              <div style={{...iosFrameStyles.signalBar,height:4}}/>
              <div style={{...iosFrameStyles.signalBar,height:6}}/>
              <div style={{...iosFrameStyles.signalBar,height:9}}/>
              <div style={{...iosFrameStyles.signalBar,height:11}}/>
            </div>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none" style={{color:tc}}>
              <path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor"/>
              <path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round"/>
              <path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" opacity="0.7"/>
            </svg>
            <div style={iosFrameStyles.batteryIcon}>
              <div style={{width:`${battery}%`,height:'100%',background:'currentColor',borderRadius:1,opacity:0.9}}/>
              <div style={iosFrameStyles.batteryCap}/>
            </div>
          </div>
        </div>
        <div style={iosFrameStyles.dynamicIsland}/>
        <div style={{...iosFrameStyles.content}}>
          {children}
        </div>
        <div style={iosFrameStyles.homeIndicator}/>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════════════

const CHILDREN = [
  { id:'c1', name:'安安', initial:'安', color:'#1890ff' },
  { id:'c2', name:'小宇', initial:'宇', color:'#52c41a' },
];

const EVENTS = [
  { date:'2026-05-09', type:'class', childId:'c1', title:'钢琴课', time:'18:30-19:30', status:'attended', subtitle:'60分钟 · 消耗1课时', note:'练习肖邦练习曲，左手伴奏有很大进步', photos:2 },
  { date:'2026-05-09', type:'class', childId:'c1', title:'美术课', time:'09:00-10:30', status:'attended', subtitle:'90分钟 · 消耗1.5课时', note:'水彩风景画，画了日落', photos:3 },
  { date:'2026-05-08', type:'achievement', childId:'c2', title:'完成25米自由泳', subtitle:'游泳', note:'教练确认达标，蛙泳和自由泳都能独立完成25米', photos:1 },
  { date:'2026-05-08', type:'class', childId:'c2', title:'游泳课', time:'16:00-17:00', status:'attended', subtitle:'60分钟 · 消耗1课时', note:'自由泳练习' },
  { date:'2026-05-07', type:'class', childId:'c1', title:'舞蹈课', time:'17:00-18:00', status:'leave', note:null },
  { date:'2026-05-05', type:'package', childId:'c1', title:'购入钢琴课时包', subtitle:'24课时 · ¥4,800', note:'2026春季包，有效期至8月31日' },
  { date:'2026-05-05', type:'class', childId:'c1', title:'钢琴课', time:'18:30-19:30', status:'attended', subtitle:'60分钟 · 消耗1课时', note:'车尔尼599第45条' },
  { date:'2026-05-03', type:'class', childId:'c2', title:'编程课', time:'14:00-15:30', status:'attended', subtitle:'90分钟 · 消耗1.5课时', note:'Python入门-变量和数据类型', photos:1 },
  { date:'2026-05-02', type:'class', childId:'c1', title:'美术课', time:'09:00-10:30', status:'makeup', subtitle:'90分钟 · 补课', note:'素描静物写生', photos:2 },
  { date:'2026-05-01', type:'achievement', childId:'c1', title:'钢琴三级通过', subtitle:'钢琴', note:'中央音乐学院考级，成绩良好', photos:1 },
  { date:'2026-05-01', type:'class', childId:'c2', title:'游泳课', time:'16:00-17:00', status:'absent', note:null },
];

// ═══════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════

const TYPE_CONFIG = {
  class:      { color:'#1890ff', icon:'📚', label:'上课' },
  achievement:{ color:'#faad14', icon:'🏆', label:'成就' },
  package:    { color:'#52c41a', icon:'📦', label:'课包' },
};

const STATUS_MAP = {
  attended: { label:'已上课', bg:'#f0fdf4', color:'#166534' },
  leave:    { label:'请假',   bg:'#f9fafb', color:'#6b7280' },
  cancelled:{ label:'取消',   bg:'#f9fafb', color:'#6b7280' },
  absent:   { label:'缺课',   bg:'#fef2f2', color:'#991b1b' },
  makeup:   { label:'补课',   bg:'#eff6ff', color:'#1e40af' },
};

const WEEKDAYS = ['日','一','二','三','四','五','六'];

function formatDate(dateStr){
  const d = new Date(dateStr);
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 周${WEEKDAYS[d.getDay()]}`;
}

function getChild(id){ return CHILDREN.find(c=>c.id===id); }

// ═══════════════════════════════════════════════════════════════
// COMPONENTS
// ═══════════════════════════════════════════════════════════════

function AppBar(){
  return(
    <div style={{
      position:'sticky',top:0,zIndex:10,
      background:'rgba(255,255,255,0.92)',backdropFilter:'blur(12px)',
      WebkitBackdropFilter:'blur(12px)',
      borderBottom:'1px solid rgba(0,0,0,0.06)',
      display:'flex',alignItems:'center',justifyContent:'space-between',
      padding:'12px 20px',
    }}>
      <span style={{fontSize:20,fontWeight:700,color:'#1a1a1a'}}>成长</span>
      <div style={{
        width:36,height:36,borderRadius:10,background:'#f5f5f5',
        display:'flex',alignItems:'center',justifyContent:'center',
        cursor:'pointer',
      }}>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <rect x="2" y="10" width="6" height="8" rx="1" fill="#666"/>
          <rect x="12" y="4" width="6" height="14" rx="1" fill="#666"/>
        </svg>
      </div>
    </div>
  );
}

function DateHeader({date,isFirst}){
  return(
    <div style={{
      padding: isFirst ? '12px 16px 8px' : '20px 16px 8px',
    }}>
      <span style={{
        fontSize:13,fontWeight:700,color:'#1890ff',
        letterSpacing:'0.02em',
      }}>
        {formatDate(date)}
      </span>
    </div>
  );
}

function Avatar({child}){
  return(
    <div style={{
      width:36,height:36,borderRadius:'50%',
      background:child.color,
      display:'flex',alignItems:'center',justifyContent:'center',
      flexShrink:0,
      color:'#fff',fontSize:14,fontWeight:600,
    }}>
      {child.initial}
    </div>
  );
}

function StatusBadge({status}){
  const s = STATUS_MAP[status];
  if(!s) return null;
  return(
    <span style={{
      fontSize:11,fontWeight:500,
      padding:'2px 8px',borderRadius:4,
      background:s.bg,color:s.color,
      whiteSpace:'nowrap',
    }}>
      {s.label}
    </span>
  );
}

function PhotoGrid({count}){
  if(!count) return null;
  const photos = Array.from({length:count});
  return(
    <div style={{display:'flex',gap:4,marginTop:8}}>
      {photos.map((_,i)=>(
        <div key={i} style={{
          flex:1,aspectRatio:'1',borderRadius:6,
          background:'#ececec',
          display:'flex',alignItems:'center',justifyContent:'center',
        }}>
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" opacity="0.35">
            <rect x="2" y="4" width="16" height="12" rx="2" stroke="#666" strokeWidth="1.2" fill="none"/>
            <circle cx="7" cy="9" r="2" stroke="#666" strokeWidth="1" fill="none"/>
            <path d="M12 8l4 5H8l2-3 2 2z" stroke="#666" strokeWidth="0.8" fill="none"/>
          </svg>
        </div>
      ))}
    </div>
  );
}

function FeedCard({event}){
  const child = getChild(event.childId);
  const cfg = TYPE_CONFIG[event.type];

  return(
    <div style={{
      margin:'0 16px 8px',
      background:'#fff',
      borderRadius:12,
      boxShadow:'0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04)',
      overflow:'hidden',
      display:'flex',
    }}>
      {/* Left color bar */}
      <div style={{
        width:4,flexShrink:0,
        background:cfg.color,
        borderRadius:'12px 0 0 12px',
      }}/>

      {/* Card content */}
      <div style={{padding:'14px',flex:1,minWidth:0}}>
        {/* Row 1: Avatar + Name + Time */}
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <Avatar child={child}/>
          <span style={{fontSize:14,fontWeight:600,color:'#1a1a1a',flex:1}}>{child.name}</span>
          {event.time && (
            <span style={{fontSize:12,color:'#999',whiteSpace:'nowrap'}}>{event.time}</span>
          )}
        </div>

        {/* Row 2: Type dot + Title + Status */}
        <div style={{display:'flex',alignItems:'center',gap:6,marginTop:8}}>
          <div style={{
            width:8,height:8,borderRadius:'50%',
            background:cfg.color,flexShrink:0,
          }}/>
          <span style={{fontSize:15,fontWeight:600,color:'#1a1a1a',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
            {event.title}
          </span>
          {event.status && <StatusBadge status={event.status}/>}
        </div>

        {/* Row 3: Subtitle */}
        {event.subtitle && (
          <div style={{marginTop:4,paddingLeft:14}}>
            <span style={{fontSize:13,color:'#666',lineHeight:1.4}}>{event.subtitle}</span>
          </div>
        )}

        {/* Row 4: Note */}
        {event.note && (
          <div style={{
            marginTop:8,padding:'10px 12px',
            background:'#f7f7f7',borderRadius:8,
            borderLeft:`2px solid ${cfg.color}22`,
          }}>
            <span style={{fontSize:13,color:'#555',lineHeight:1.5}}>{event.note}</span>
          </div>
        )}

        {/* Row 5: Photos */}
        {event.photos && <PhotoGrid count={event.photos}/>}
      </div>
    </div>
  );
}

function FeedList(){
  const grouped = useMemo(()=>{
    const map = new Map();
    EVENTS.forEach(e=>{
      if(!map.has(e.date)) map.set(e.date,[]);
      map.get(e.date).push(e);
    });
    return Array.from(map.entries()).sort((a,b)=>b[0].localeCompare(a[0]));
  },[]);

  return(
    <div style={{paddingBottom:24}}>
      {grouped.map(([date,events],gi)=>(
        <div key={date}>
          <DateHeader date={date} isFirst={gi===0}/>
          {events.map((ev,i)=>(
            <FeedCard key={`${date}-${i}`} event={ev}/>
          ))}
        </div>
      ))}
    </div>
  );
}

function GrowthPage(){
  return(
    <div style={{height:'100%',display:'flex',flexDirection:'column',background:'#f5f5f5'}}>
      <AppBar/>
      <div style={{flex:1,overflow:'auto',WebkitOverflowScrolling:'touch'}}>
        <FeedList/>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════

ReactDOM.createRoot(document.getElementById('root')).render(
  <IosFrame time="9:41" battery={85}>
    <GrowthPage/>
  </IosFrame>
);

</script>
</body>
</html>
