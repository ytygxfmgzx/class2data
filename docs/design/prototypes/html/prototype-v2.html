<style>
:root {
  --bg:#f5f5f5; --bg-card:#fff;
  --text-1:#1a1a1a; --text-2:#666; --text-3:#999;
  --border:#e8e8e8;
  --blue:#1890ff; --green:#52c41a; --orange:#fa8c16; --red:#f5222d;

  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);font-size:14px;color:var(--text-1);background:#1a1a2e;line-height:1.4;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;align-items:center;min-height:100vh}
#root{display:flex;justify-content:center;align-items:center}

/* iOS Frame */
.ios-wrap{display:inline-block;padding:12px;background:#000;border-radius:60px;box-shadow:0 0 0 2px #1f2937,0 20px 60px rgba(0,0,0,.3);position:relative}
.ios-screen{position:relative;border-radius:48px;overflow:hidden;width:393px;height:852px}
.ios-island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:124px;height:36px;background:#000;border-radius:999px;z-index:30}
.ios-status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;font-size:16px;font-weight:600;z-index:20;pointer-events:none}
.ios-content{position:absolute;top:54px;left:0;right:0;bottom:34px;overflow:auto;-webkit-overflow-scrolling:touch}
.ios-content::-webkit-scrollbar{display:none}
.ios-home{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:140px;height:5px;background:rgba(0,0,0,.25);border-radius:999px;z-index:10}

/* Page transitions */
.page-enter{animation:slideIn .2s ease-out}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
.modal-enter{animation:slideUp .25s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.fade-in{animation:fadeIn .15s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>

function TopBar({ title, onBack, rightAction, children }) {
  return (
    <div style={S.topBar}>
      {onBack && <button onClick={onBack} style={{...S.btn, marginRight:4, color:'var(--blue)'}}><Icon name="chevronLeft" size={22}/></button>}
      <span style={S.topBarTitle}>{title}</span>
      {rightAction}
      {children}
    </div>
  );
}

function StatusTag({ status }) {
  const map = {
    attended: { label:'已上课', bg:'var(--bg-green)', color:'var(--green)' },
    leave: { label:'请假', bg:'var(--bg)', color:'var(--text-3)' },
    cancel: { label:'取消', bg:'var(--bg)', color:'var(--text-3)' },
    absent: { label:'缺课', bg:'var(--bg-red)', color:'var(--red)' },
    makeup: { label:'补课', bg:'var(--bg-blue)', color:'var(--blue)' },
    pending: { label:'待处理', bg:'var(--bg-orange)', color:'var(--orange)' },
    active: { label:'启用', bg:'var(--bg-green)', color:'var(--green)' },
    inactive: { label:'停用', bg:'var(--bg)', color:'var(--text-3)' },
  };
  const t = map[status] || { label:status, bg:'var(--bg)', color:'var(--text-3)' };
  return <span style={{fontSize:10, padding:'1px 6px', borderRadius:2, fontWeight:500, background:t.bg, color:t.color}}>{t.label}</span>;
}

function MetricCell({ label, value, variant }) {
  const vc = variant === 'danger' ? 'var(--red)' : variant === 'warning' ? 'var(--orange)' : variant === 'good' ? 'var(--green)' : 'var(--text-1)';
  return (
    <div style={{background:'var(--bg-card)', padding:12, textAlign:'center'}}>
      <span style={{fontSize:12, color:'var(--text-3)', display:'block'}}>{label}</span>
      <span style={{fontSize:20, fontWeight:600, color:vc, display:'block', marginTop:2}}>{value}</span>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// §4 HOME SCREEN
// ═══════════════════════════════════════════════════════════════

function HomeScreen({ nav, childFilter, setChildFilter, courseFilter, setCourseFilter, selectedDate, setSelectedDate }) {
  const [menuOpen, setMenuOpen] = useState(false);
  const [showMonthPicker, setShowMonthPicker] = useState(false);
  const [pickerYear, setPickerYear] = useState(new Date(selectedDate || Date.now()).getFullYear());

  const shiftWeek = (dir) => {
    const d = new Date(selectedDate || Date.now());
    d.setDate(d.getDate() + dir * 7);
    setSelectedDate(d.toISOString().slice(0,10));
  };

  // Week dates
  const weekDates = useMemo(() => {
    const d = selectedDate ? new Date(selectedDate) : new Date();
    const day = d.getDay() || 7;
    const mon = new Date(d);
    mon.setDate(d.getDate() - day + 1);
    return Array.from({length:7}, (_, i) => {
      const dd = new Date(mon);
      dd.setDate(mon.getDate() + i);
      return dd;
    });
  }, [selectedDate]);

  const todayStr = new Date().toISOString().slice(0, 10);
  const selStr = selectedDate || todayStr;
  const weekNames = ['一','二','三','四','五','六','日'];

  // Filter courses for selected date
  const dayCourses = useMemo(() => {
    const sel = new Date(selStr);
    const weekday = sel.getDay() || 7;
    return PLANS.filter(p => {
      if (p.weekday !== weekday) return false;
      if (childFilter !== 'all') { const crs = getCourse(p.courseId); if (crs.childId !== childFilter) return false; }
      if (courseFilter !== 'all' && p.courseId !== courseFilter) return false;
      return true;
    }).map(p => ({...p, course: getCourse(p.courseId), child: getChild(getCourse(p.courseId).childId)}));
  }, [selStr, childFilter, courseFilter]);

  // Alerts
  const alerts = COURSES.filter(c => (c.totalPurchased - c.used) <= 4).map(c => {
    const ch = getChild(c.childId);
    return `${c.name}还剩 ${c.totalPurchased - c.used} 课时`;
  });

  return (
    <div style={{display:'flex', flexDirection:'column', height:'100%', background:'var(--bg)'}}>
      {/* Top bar */}
      <div style={{...S.topBar, justifyContent:'space-between'}}>
        <span style={{fontSize:17, fontWeight:600}}>今天</span>
        {alerts.length > 0 && <span style={{fontSize:11, color:'var(--red)', background:'var(--bg-red)', padding:'2px 6px', borderRadius:2, marginRight:4}}>{alerts[0]}</span>}
        <button onClick={() => setMenuOpen(!menuOpen)} style={{...S.btn, width:32, height:32}} aria-label="快捷操作">
          <Icon name="plus" size={20} color="var(--text-1)"/>
        </button>
      </div>

      {/* Plus menu */}
      {menuOpen && <>
        <div onClick={() => setMenuOpen(false)} style={{position:'fixed', top:0, left:0, right:0, bottom:0, zIndex:15}}/>
        <div className="fade-in" style={{position:'absolute', top:44, right:12, width:160, background:'var(--bg-card)', border:'1px solid var(--border)', borderRadius:4, boxShadow:'0 2px 8px rgba(0,0,0,.12)', zIndex:16, overflow:'hidden'}}>
          {[
            { label:'记录上课', icon:'edit', action:() => { setMenuOpen(false); nav.openModal('record'); }},
            { label:'录入课时包', icon:'package', action:() => { setMenuOpen(false); nav.navigate('package-form'); }},
            { label:'录入课程', icon:'book', action:() => { setMenuOpen(false); nav.navigate('course-form'); }},
            { label:'录入成就', icon:'trophy', action:() => { setMenuOpen(false); nav.navigate('achievement-form'); }},
            { label:'录入孩子', icon:'personAdd', action:() => { setMenuOpen(false); nav.navigate('child-form'); }},
          ].map((item, i) => (
            <button key={i} onClick={item.action} style={{display:'flex', alignItems:'center', width:'100%', height:44, padding:'0 16px', background:'none', border:'none', borderBottom:i<4?'1px solid var(--border)':'none', fontSize:14, color:'var(--text-1)', cursor:'pointer', textAlign:'left', fontWeight:i===0?600:400}}>
              <Icon name={item.icon} size={16} color="var(--text-2)" style={{marginRight:8}}/>
              <span style={{marginLeft:8}}>{item.label}</span>
            </button>
          ))}
        </div>
      </>}

      {/* Week navigation */}
      <div style={{display:'flex', alignItems:'center', padding:'6px 12px', background:'var(--bg-card)', borderBottom:'1px solid var(--border)', gap:4}}>
        <button onClick={() => shiftWeek(-1)} style={{...S.btn, width:28, height:28, flexShrink:0}}><Icon name="chevronLeft" size={18} color="var(--text-2)"/></button>
        <button onClick={() => { setShowMonthPicker(!showMonthPicker); setPickerYear(new Date(selStr).getFullYear()); }} style={{flex:1, textAlign:'center', fontSize:14, fontWeight:600, background:'none', border:'none', cursor:'pointer', color:'var(--text-1)'}}>
          {new Date(selStr).getFullYear()}年{new Date(selStr).getMonth()+1}月
          <span style={{fontSize:11, color:'var(--text-3)', fontWeight:400, marginLeft:4}}>▾</span>
        </button>
        <button onClick={() => shiftWeek(1)} style={{...S.btn, width:28, height:28, flexShrink:0}}><Icon name="chevronRight" size={18} color="var(--text-2)"/></button>
      </div>
      {/* Day info bar */}
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'4px 16px', background:'var(--bg-card)', borderBottom:'1px solid var(--border)'}}>
        <span style={{fontSize:12, color:'var(--text-3)'}}>周{weekNames[(new Date(selStr).getDay()||7)-1]} · {new Date(selStr).getMonth()+1}月{new Date(selStr).getDate()}日</span>
        <span style={{fontSize:12, color: dayCourses.length > 0 ? 'var(--text-2)' : 'var(--text-3)'}}>
          {dayCourses.length > 0 ? `${dayCourses.length} 节课程` : '无课程'}
        </span>
      </div>

      {/* Month picker */}
      {showMonthPicker && <>
        <div onClick={() => setShowMonthPicker(false)} style={{position:'fixed', top:0, left:0, right:0, bottom:0, zIndex:15}}/>
        <div className="fade-in" style={{position:'absolute', top:50, left:16, right:16, background:'var(--bg-card)', border:'1px solid var(--border)', borderRadius:4, boxShadow:'0 2px 8px rgba(0,0,0,.12)', zIndex:16, padding:12}}>
          <div style={{display:'flex', alignItems:'center', justifyContent:'center', gap:16, marginBottom:12}}>
            <button onClick={() => setPickerYear(pickerYear - 1)} style={S.btn}><Icon name="chevronLeft" size={16} color="var(--text-2)"/></button>
            <span style={{fontSize:14, fontWeight:600, minWidth:50, textAlign:'center'}}>{pickerYear}年</span>
            <button onClick={() => setPickerYear(pickerYear + 1)} style={S.btn}><Icon name="chevronRight" size={16} color="var(--text-2)"/></button>
          </div>
          <div style={{display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:8}}>
            {Array.from({length:12}, (_, i) => {
              const selD = new Date(selStr);
              const isActive = pickerYear === selD.getFullYear() && i === selD.getMonth();
              return (
                <button key={i} onClick={() => { setSelectedDate(new Date(pickerYear, i, 1).toISOString().slice(0,10)); setShowMonthPicker(false); }} style={{padding:'6px 0', fontSize:13, border:'1px solid var(--border)', borderRadius:4, background:isActive?'var(--bg-blue)':'var(--bg-card)', color:isActive?'var(--blue)':'var(--text-1)', cursor:'pointer', fontWeight:isActive?500:400}}>
                  {i+1}月
                </button>
              );
            })}
          </div>
        </div>
      </>}

      {/* Child filter */}
      <div style={{display:'flex', gap:12, padding:'10px 16px', background:'var(--bg-card)', borderBottom:'1px solid var(--border)', alignItems:'flex-start'}}>
        {[{id:'all', name:'全部', initial:'全'}, ...CHILDREN].map(c => (
          <button key={c.id} onClick={() => setChildFilter(c.id)} style={{display:'flex', flexDirection:'column', alignItems:'center', gap:3, background:'none', border:'none', cursor:'pointer', padding:0}}>
            <div style={{width:34, height:34, borderRadius:999, background: childFilter===c.id ? 'var(--bg-blue)' : 'var(--border)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:12, fontWeight:600, color: childFilter===c.id ? 'var(--blue)' : 'var(--text-2)', border: childFilter===c.id ? '2px solid var(--blue)' : '2px solid transparent', transition:'all .15s'}}>
              {c.initial}
            </div>
            <span style={{fontSize:10, color: childFilter===c.id ? 'var(--blue)' : 'var(--text-3)', fontWeight: childFilter===c.id ? 500 : 400}}>{c.name}</span>
          </button>
        ))}
      </div>

      {/* Course filter */}
      <div style={{display:'flex', gap:8, padding:'8px 16px', overflowX:'auto', background:'var(--bg)'}}>
        <button onClick={() => setCourseFilter('all')} style={{...S.chip, ...(courseFilter==='all' ? S.chipActive : {})}}>全部课程</button>
        {COURSES.filter(c => childFilter === 'all' || c.childId === childFilter).map(c => (
          <button key={c.id} onClick={() => setCourseFilter(c.id)} style={{...S.chip, ...(courseFilter===c.id ? S.chipActive : {})}}>{c.name}</button>
        ))}
      </div>

      {/* Week strip */}
      <div style={{display:'flex', background:'var(--bg-card)', borderBottom:'1px solid var(--border)'}}>
        {weekDates.map((d, i) => {
          const ds = d.toISOString().slice(0, 10);
          const isToday = ds === todayStr;
          const isSel = ds === selStr;
          const hasCourse = PLANS.some(p => p.weekday === (d.getDay()||7));
          return (
            <div key={i} onClick={() => setSelectedDate(ds)} style={{flex:1, textAlign:'center', padding:'6px 0', cursor:'pointer', position:'relative'}}>
              <span style={{fontSize:10, color:'var(--text-3)', display:'block'}}>{weekNames[i]}</span>
              <span style={{fontSize:14, display:'block', marginTop:2, color: isSel||isToday ? 'var(--blue)' : 'var(--text-1)', fontWeight: isSel||isToday ? 600 : 400}}>{d.getDate()}</span>
              {isSel && <div style={{position:'absolute', bottom:0, left:'25%', right:'25%', height:2, background:'var(--blue)', borderRadius:1}}/>}
              {hasCourse && !isSel && <div style={{width:4, height:4, borderRadius:999, background:'var(--blue)', margin:'2px auto 0'}}/>}
            </div>
          );
        })}
      </div>

      {/* Course list */}
      <div style={{flex:1, overflow:'auto'}}>
        {dayCourses.length === 0 ? (
          <EmptyState message="今天没有课程" action="查看其他日期"/>
        ) : dayCourses.map(p => (
          <div key={p.id} onClick={() => nav.navigate('course-detail', {courseId: p.courseId})} style={{display:'flex', alignItems:'flex-start', padding:'10px 16px', background:'var(--bg-card)', borderBottom:'1px solid var(--border)', cursor:'pointer'}}>
            <div style={{width:44, flexShrink:0, fontSize:14, fontWeight:500, color:'var(--text-1)', paddingTop:2}}>{p.startTime}</div>
            <div style={{flex:1, minWidth:0}}>
              <div style={{display:'flex', alignItems:'center', gap:6}}>
                <span style={{fontSize:15, fontWeight:600, color:'var(--text-1)'}}>{p.course.name}</span>
                <span style={{fontSize:12, color:'var(--text-2)'}}>· {p.child.name}</span>
              </div>
              <div style={{fontSize:12, color:'var(--text-3)', marginTop:2}}>{p.course.institution} · {p.location}</div>
            </div>
            <div style={{flexShrink:0, display:'flex', flexDirection:'column', alignItems:'flex-end', gap:4}}>
              <StatusTag status="pending"/>
              <button onClick={(e) => { e.stopPropagation(); nav.openModal('record', {courseId: p.courseId, planId: p.id}); }} style={{fontSize:12, color:'var(--blue)', background:'none', border:'none', cursor:'pointer', fontWeight:500, padding:'2px 0'}}>记录</button>
            </div>
          </div>
        ))}
      </div>

      {/* Tab bar */}
      <TabBar active="home" onTab={nav.goHome}/>
    </div>
  );
}

function GrowthScreen({ nav, growthChild, setGrowthChild }) {
  const filtered = growthChild === 'all' ? TIMELINE : TIMELINE.filter(t => t.childId === growthChild);
  const grouped = useMemo(() => {
    const m = {};
    filtered.forEach(t => { (m[t.date] = m[t.date] || []).push(t); });
    return Object.entries(m).sort((a,b) => b[0].localeCompare(a[0]));
  }, [filtered]);

  return (
    <div style={{display:'flex', flexDirection:'column', height:'100%', background:'var(--bg)'}}>
      <div style={{...S.topBar, justifyContent:'space-between'}}>
        <span style={{fontSize:17, fontWeight:600}}>成长</span>
        <button onClick={() => nav.navigate('achievement-form')} style={{...S.btn, color:'var(--blue)', fontSize:14, fontWeight:500}}>录入成就</button>
      </div>

      {/* Child filter */}
      <div style={{display:'flex', gap:12, padding:'10px 16px', background:'var(--bg-card)', borderBottom:'1px solid var(--border)', alignItems:'flex-start'}}>
        {[{id:'all', name:'全部', initial:'全'}, ...CHILDREN].map(c => (
          <button key={c.id} onClick={() => setGrowthChild(c.id)} style={{display:'flex', flexDirection:'column', alignItems:'center', gap:3, background:'none', border:'none', cursor:'pointer', padding:0}}>
            <div style={{width:34, height:34, borderRadius:999, background: growthChild===c.id ? 'var(--bg-blue)' : 'var(--border)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:12, fontWeight:600, color: growthChild===c.id ? 'var(--blue)' : 'var(--text-2)', border: growthChild===c.id ? '2px solid var(--blue)' : '2px solid transparent', transition:'all .15s'}}>
              {c.initial}
            </div>
            <span style={{fontSize:10, color: growthChild===c.id ? 'var(--blue)' : 'var(--text-3)'}}>{c.name}</span>
          </button>
        ))}
      </div>

      {/* Photo wall entry */}
      <div onClick={() => nav.navigate('photo-wall')} style={{display:'flex', alignItems:'center', padding:'10px 16px', background:'var(--bg-card)', borderBottom:'1px solid var(--border)', cursor:'pointer'}}>
        <Icon name="photo" size={18} color="var(--text-2)"/>
        <div style={{flex:1, marginLeft:10}}>
          <div style={{fontSize:14, fontWeight:500}}>照片墙</div>
          <div style={{fontSize:12, color:'var(--text-3)'}}>共 12 张</div>
        </div>
        <div style={{display:'flex', gap:4}}>
          {[0,1,2].map(i => <div key={i} style={{width:28, height:28, borderRadius:2, background:'var(--border)'}}/>)}
        </div>
        <Icon name="chevronRight" size={16} color="var(--text-3)" style={{marginLeft:8}}/>
      </div>

      {/* Timeline */}
      <div style={{flex:1, overflow:'auto'}}>
        {grouped.map(([date, items]) => (
          <div key={date}>
            <div style={{fontSize:12, color:'var(--text-3)', padding:'8px 16px', background:'var(--bg)'}}>{date}</div>
            {items.map(t => {
              const ch = getChild(t.childId);
              const crs = t.courseId ? getCourse(t.courseId) : null;
              return (
                <div key={t.id} style={{display:'flex', padding:'10px 16px', background:'var(--bg-card)', borderBottom:'1px solid var(--border)', cursor:'pointer'}}>
                  <div style={{width:36, height:36, borderRadius:4, flexShrink:0, marginRight:12, display:'flex', alignItems:'center', justifyContent:'center', fontSize:14,
                    background: t.type==='achievement' ? 'var(--bg-orange)' : t.type==='package' ? 'var(--bg-blue)' : 'var(--bg)',
                    color: t.type==='achievement' ? 'var(--orange)' : t.type==='package' ? 'var(--blue)' : 'var(--text-3)'
                  }}>
                    {t.type==='achievement' ? '🏆' : t.type==='package' ? '📦' : '📖'}
                  </div>
                  <div style={{flex:1, minWidth:0}}>
                    <div style={{fontSize:14, color:'var(--text-1)'}}>
                      <span style={{color:'var(--blue)', fontWeight:500}}>{ch.name}</span>
                      {' · '}{t.title}
                    </div>
                    <div style={{fontSize:12, color:'var(--text-3)', marginTop:2}}>
                      {t.detail}
                      {t.status && <StatusTag status={t.status}/>}
                    </div>
                  </div>
                  <div style={{flexShrink:0, fontSize:12, color:'var(--text-3)', marginLeft:8}}>{t.time}</div>
                </div>
              );
            })}
          </div>
        ))}
      </div>

      <TabBar active="growth" onTab={nav.goHome}/>
    </div>
  );
}

function CourseDetailScreen({ nav, courseId }) {
  const c = getCourse(courseId) || COURSES[0];
  const ch = getChild(c.childId);
  const [tab, setTab] = useState('plans');
  const remaining = c.totalPurchased - c.used;
  const pkgs = PACKAGES.filter(p => p.courseId === c.id);
  const plans = PLANS.filter(p => p.courseId === c.id);
  const recs = RECORDS.filter(r => r.courseId === c.id);

  return (
    <div style={{display:'flex', flexDirection:'column', height:'100%', background:'var(--bg)'}}>
      <TopBar title="课程详情" onBack={nav.goBack} rightAction={
        <button onClick={() => nav.navigate('course-form', {courseId: c.id})} style={{...S.btn, color:'var(--blue)', fontSize:14, fontWeight:500}}>编辑</button>
      }/>

      <div style={{display:'flex', alignItems:'center', gap:8, padding:'10px 16px', background:'var(--bg-card)', borderBottom:'1px solid var(--border)'}}>
        <span style={{fontSize:12, color:'var(--text-2)'}}>{ch.name}</span>
        <span style={{fontSize:15, fontWeight:600}}>{c.name}</span>
        <span style={{fontSize:12, color:'var(--text-3)', marginLeft:'auto'}}>{c.institution}</span>
      </div>

      {/* Metrics */}
      <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:1, background:'var(--border)', borderTop:'1px solid var(--border)', borderBottom:'1px solid var(--border)'}}>
        <MetricCell label="已购课时" value={c.totalPurchased}/>
        <MetricCell label="已花费" value={`¥${fmt(c.cost)}`}/>
        <MetricCell label="剩余课时" value={remaining} variant={remaining<=4?'danger':undefined}/>

function RecordModal({ nav, courseId }) {
  const defaultCourse = getCourse(courseId) || COURSES[0];
  const [selectedCourseId, setSelectedCourseId] = useState(defaultCourse.id);
  const c = getCourse(selectedCourseId) || COURSES[0];
  const ch = getChild(c.childId);
  const [status, setStatus] = useState('attended');
  const [hours, setHours] = useState(1);
  const statuses = [
    { key:'attended', label:'已上课' },
    { key:'leave', label:'请假' },
    { key:'cancel', label:'取消' },
    { key:'absent', label:'缺课' },
    { key:'makeup', label:'补课' },
  ];
  const pkg = PACKAGES.find(p => p.courseId === c.id && (p.total - p.used) > 0);

  return (
    <div onClick={nav.closeModal} style={{position:'absolute', inset:0, background:'rgba(0,0,0,.4)', zIndex:40, display:'flex', alignItems:'flex-end'}}>
      <div onClick={e => e.stopPropagation()} className="modal-enter" style={{width:'100%', maxHeight:'85%', background:'var(--bg-card)', borderRadius:'6px 6px 0 0', overflowY:'auto', paddingBottom:20}}>
        <div style={{width:32, height:4, background:'var(--border)', borderRadius:2, margin:'8px auto 12px'}}/>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'0 16px', marginBottom:12}}>
          <span style={{fontSize:17, fontWeight:600}}>记录上课</span>
          <button onClick={nav.closeModal} style={S.btn}><Icon name="x" size={18} color="var(--text-3)"/></button>
        </div>

        <div style={{padding:'0 16px'}}>
          <div style={S.formGroup}>
            <label style={S.formLabel}>课程</label>
            <select value={selectedCourseId} onChange={e => setSelectedCourseId(e.target.value)} style={S.formSelect}>
              {COURSES.map(co => {
                const ch2 = getChild(co.childId);
                return <option key={co.id} value={co.id}>{co.name} · {ch2.name}</option>;
              })}
            </select>
          </div>
        </div>

        <div style={{padding:'0 16px', marginBottom:12}}>
          <div style={{fontSize:12, color:'var(--text-3)'}}>{ch.name} · {c.institution}</div>
        </div>

        <div style={{display:'flex', gap:8, padding:'0 16px', marginBottom:12, flexWrap:'wrap'}}>
          {statuses.map(s => (
            <button key={s.key} onClick={() => setStatus(s.key)} style={{
              padding:'4px 10px', fontSize:12, fontWeight:500, borderRadius:2,
              border: status===s.key ? '1px solid' : '1px solid var(--border)',
              background: status===s.key ? (s.key==='attended'?'var(--bg-green)':s.key==='absent'?'var(--bg-red)':s.key==='makeup'?'var(--bg-blue)':'var(--bg)') : 'var(--bg-card)',
              color: status===s.key ? (s.key==='attended'?'var(--green)':s.key==='absent'?'var(--red)':s.key==='makeup'?'var(--blue)':'var(--text-3)') : 'var(--text-2)',
              cursor:'pointer', transition:'all .15s'
            }}>{s.label}</button>
          ))}
        </div>

        <div style={{padding:'0 16px'}}>
          <div style={S.formGroup}>
            <label style={S.formLabel}>课包</label>
            <select style={S.formSelect}>
              {pkg ? <option>{pkg.name} · 剩 {pkg.total-pkg.used} 课时</option> : <option>无可用课包</option>}
            </select>
          </div>
          <div style={S.formGroup}>
            <label style={S.formLabel}>扣课时</label>
            <div style={{display:'flex', alignItems:'center', gap:12}}>
              <button onClick={() => setHours(Math.max(0, hours-0.5))} style={{width:32, height:32, border:'1px solid var(--border)', borderRadius:4, background:'var(--bg-card)', fontSize:16, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center'}}>−</button>
              <span style={{fontSize:14, fontWeight:600, minWidth:24, textAlign:'center'}}>{hours}</span>
              <button onClick={() => setHours(hours+0.5)} style={{width:32, height:32, border:'1px solid var(--border)', borderRadius:4, background:'var(--bg-card)', fontSize:16, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center'}}>+</button>
            </div>
          </div>
          <div style={S.formGroup}>
            <label style={S.formLabel}>实际时长</label>
            <input type="text" defaultValue="90 分钟" style={S.formInput}/>
          </div>
          <div style={S.formGroup}>
            <label style={S.formLabel}>备注</label>
            <textarea placeholder="可记录课堂内容、请假原因或补课说明" style={S.formTextarea}/>
          </div>
          <PhotoUpload label="拍照/上传附件（可选）"/>
        </div>

        <button onClick={() => { nav.closeModal(); }} style={{display:'block', width:'calc(100% - 32px)', margin:'16px auto 0', ...S.btnPrimary}}>保存记录</button>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// §13b PLAN FORM
// ═══════════════════════════════════════════════════════════════

function PlanFormScreen({ nav, planId }) {
  const existing = planId ? PLANS.find(p => p.id === planId) : null;
  const defaultCourse = existing ? getCourse(existing.courseId) : COURSES[0];
  const [courseId, setCourseId] = useState(defaultCourse.id);
  const [cycleMode, setCycleMode] = useState('weekly');

  // Slots: each slot = { id, day, startTime, endTime }
  // weekly: day = weekday number (1-7)
  // monthly: day = day-of-month (1-31)
  // fixed: day = 'YYYY-MM-DD'
  const [slots, setSlots] = useState(existing ? [{id:1, day:existing.weekday, startTime:existing.startTime, endTime:existing.endTime}] : []);
  const [newDay, setNewDay] = useState(cycleMode === 'weekly' ? 1 : cycleMode === 'monthly' ? 1 : '');
  const [newStart, setNewStart] = useState('09:00');
  const [newEnd, setNewEnd] = useState('10:00');
  const [slotIdSeq, setSlotIdSeq] = useState(2);

  const weekLabels = ['一','二','三','四','五','六','日'];

  const cycleModes = [
    { key:'weekly', label:'按周循环' },
    { key:'monthly', label:'按月循环' },
    { key:'fixed', label:'指定日期' },
  ];

  const addSlot = () => {
    if (cycleMode === 'fixed' && !newDay) return;
    setSlots([...slots, {id: slotIdSeq, day: newDay, startTime: newStart, endTime: newEnd}]);
    setSlotIdSeq(slotIdSeq + 1);
  };
  const removeSlot = (id) => setSlots(slots.filter(s => s.id !== id));

  const dayLabel = (slot) => {
    if (cycleMode === 'weekly') return '周' + weekLabels[slot.day - 1];
    if (cycleMode === 'monthly') return '每月' + slot.day + '日';
    return slot.day;
  };

  const daySelector = () => {
    if (cycleMode === 'weekly') return (
      <select value={newDay} onChange={e => setNewDay(Number(e.target.value))} style={{...S.formSelect, width:100, flex:'none'}}>
        {weekLabels.map((w, i) => <option key={i} value={i+1}>周{w}</option>)}
      </select>
    );
    if (cycleMode === 'monthly') return (
      <select value={newDay} onChange={e => setNewDay(Number(e.target.value))} style={{...S.formSelect, width:100, flex:'none'}}>
        {Array.from({length:31}, (_, i) => i+1).map(d => <option key={d} value={d}>{d}日</option>)}
      </select>
    );
    return (
      <input type="date" value={newDay} onChange={e => setNewDay(e.target.value)} style={{...S.formInput, flex:1, minWidth:0}}/>
    );
  };

  return (
    <div style={{display:'flex', flexDirection:'column', height:'100%', background:'var(--bg)'}}>
      <TopBar title={existing ? '编辑计划' : '添加计划'} onBack={nav.goBack}/>
      <div style={{flex:1, overflow:'auto', padding:16}}>
        <div style={S.formGroup}>
          <label style={S.formLabel}>课程</label>
          <select value={courseId} onChange={e => setCourseId(e.target.value)} style={S.formSelect}>
            {COURSES.map(c => { const ch = getChild(c.childId); return <option key={c.id} value={c.id}>{c.name} · {ch.name}</option>; })}
          </select>
        </div>
        <div style={S.formGroup}>
          <label style={S.formLabel}>上课类型</label>
          <select style={S.formSelect}><option>常规课</option><option>加练</option><option>补课</option></select>
        </div>

        {/* Cycle mode selector */}
        <div style={S.formGroup}>
          <label style={S.formLabel}>循环方式</label>
          <div style={{display:'flex', gap:6}}>
            {cycleModes.map(m => (
              <button key={m.key} onClick={() => { setCycleMode(m.key); setSlots([]); setNewDay(m.key==='weekly'?1:m.key==='monthly'?1:''); }} style={{
                flex:1, height:34, borderRadius:4, border: cycleMode===m.key ? '1px solid var(--blue)' : '1px solid var(--border)',
                background: cycleMode===m.key ? 'var(--bg-blue)' : 'var(--bg-card)',
                color: cycleMode===m.key ? 'var(--blue)' : 'var(--text-2)',
                fontSize:13, fontWeight: cycleMode===m.key ? 500 : 400, cursor:'pointer', transition:'all .15s'
              }}>{m.label}</button>
            ))}
          </div>
        </div>

        {/* Existing slots list */}
        {slots.length > 0 && (
          <div style={{marginBottom:12}}>
            <label style={S.formLabel}>已添加的上课时段</label>
            <div style={{border:'1px solid var(--border)', borderRadius:4, overflow:'hidden'}}>
              {slots.map((s, i) => (
                <div key={s.id} style={{display:'flex', alignItems:'center', padding:'8px 12px', background:'var(--bg-card)', borderBottom: i < slots.length-1 ? '1px solid var(--border)' : 'none'}}>
                  <span style={{fontSize:13, color:'var(--text-1)', fontWeight:500, flex:1}}>{dayLabel(s)}</span>
                  <span style={{fontSize:13, color:'var(--text-2)', marginRight:12}}>{s.startTime} - {s.endTime}</span>
                  <button onClick={() => removeSlot(s.id)} style={{background:'none', border:'none', cursor:'pointer', color:'var(--text-3)', fontSize:15, padding:0, lineHeight:1}}>×</button>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Add slot row */}
        <div style={{marginBottom:16, padding:12, background:'var(--bg)', borderRadius:4, border:'1px dashed var(--border)'}}>
          <div style={{fontSize:12, color:'var(--text-2)', marginBottom:8}}>
            {cycleMode === 'weekly' ? '添加周几的课' : cycleMode === 'monthly' ? '添加每月几号的课' : '添加日期'}
          </div>
          <div style={{display:'flex', gap:8, alignItems:'center', flexWrap:'wrap'}}>
            {daySelector()}
            <input type="time" value={newStart} onChange={e => setNewStart(e.target.value)} style={{...S.formInput, width:90, flex:'none'}}/>
            <span style={{color:'var(--text-3)', fontSize:12}}>至</span>
            <input type="time" value={newEnd} onChange={e => setNewEnd(e.target.value)} style={{...S.formInput, width:90, flex:'none'}}/>
            <button onClick={addSlot} style={{height:40, padding:'0 14px', background:'var(--blue)', color:'#fff', border:'none', borderRadius:4, fontSize:13, fontWeight:500, cursor:'pointer', flexShrink:0}}>添加</button>
          </div>
        </div>

        {slots.length === 0 && <div style={{fontSize:12, color:'var(--orange)', marginBottom:12}}>请至少添加一个上课时段</div>}

        <div style={{display:'flex', gap:12}}>
          <div style={{...S.formGroup, flex:1}}>
            <label style={S.formLabel}>计划开始日期</label>
            <input type="date" defaultValue="2026-05-12" style={S.formInput}/>
          </div>
          <div style={{...S.formGroup, flex:1}}>
            <label style={S.formLabel}>计划结束日期</label>
            <input type="date" style={S.formInput}/>
          </div>
        </div>
        <div style={S.formGroup}>
          <label style={S.formLabel}>地点</label>
          <input type="text" defaultValue={existing ? existing.location : ''} placeholder="上课地点" style={S.formInput}/>
        </div>
        <div style={S.formGroup}>
          <label style={S.formLabel}>状态</label>
          <select style={S.formSelect}><option>启用</option><option>停用</option></select>
        </div>
        <button onClick={nav.goBack} style={{...S.btnPrimary, marginTop:8}}>保存计划</button>
      </div>
    </div>
  );
}

function TabBar({ active, onTab }) {
  const tabs = [
    { key:'home', label:'首页', icon:'calendar' },
    { key:'growth', label:'成长', icon:'sparkles' },
    { key:'settings', label:'设置', icon:'settings' },
  ];
  return (
    <div style={S.tabBar}>
      {tabs.map(t => (
        <button key={t.key} onClick={() => onTab(t.key)} style={{...S.tabItem, ...(active===t.key ? S.tabItemActive : {})}}>
          <Icon name={t.icon} size={20} color={active===t.key ? 'var(--blue)' : 'var(--text-3)'}/>
          <span>{t.label}</span>
        </button>
      ))}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// §14 APP PHONE (State Manager)
// ═══════════════════════════════════════════════════════════════

function AppPhone() {
  const [stack, setStack] = useState(['home']);
  const [modal, setModal] = useState(null);
  const [params, setParams] = useState({});
  const [childFilter, setChildFilter] = useState('all');
  const [courseFilter, setCourseFilter] = useState('all');
  const [growthChild, setGrowthChild] = useState('all');
  const [selectedDate, setSelectedDate] = useState(new Date().toISOString().slice(0,10));

  const nav = useMemo(() => ({
    navigate: (screen, p = {}) => { setStack(s => [...s, screen]); setParams(p); },
    goBack: () => setStack(s => s.length > 1 ? s.slice(0, -1) : s),
    goHome: (tab) => { setStack([tab || 'home']); setModal(null); },
    openModal: (type, p = {}) => { setModal(type); setParams(p); },
    closeModal: () => { setModal(null); },
  }), []);

  const current = stack[stack.length - 1];
  const isTab = ['home','growth','settings'].includes(current);
  const key = current + JSON.stringify(params);

  const renderScreen = () => {
    switch(current) {
      case 'home': return <HomeScreen nav={nav} childFilter={childFilter} setChildFilter={setChildFilter} courseFilter={courseFilter} setCourseFilter={setCourseFilter} selectedDate={selectedDate} setSelectedDate={setSelectedDate}/>;
      case 'growth': return <GrowthScreen nav={nav} growthChild={growthChild} setGrowthChild={setGrowthChild}/>;
      case 'settings': return <SettingsScreen nav={nav}/>;
      case 'course-detail': return <CourseDetailScreen nav={nav} courseId={params.courseId || COURSES[0].id}/>;
      case 'photo-wall': return <PhotoWallScreen nav={nav}/>;
      case 'child-manage': return <ChildManageScreen nav={nav}/>;
      case 'course-manage': return <CourseManageScreen nav={nav}/>;
      case 'plan-manage': return <PlanManageScreen nav={nav}/>;
      case 'plan-form': return <PlanFormScreen nav={nav} planId={params.planId}/>;
      case 'tag-manage': return <TagManageScreen nav={nav}/>;
      case 'backup': return <BackupScreen nav={nav}/>;
      case 'notification': return <NotificationScreen nav={nav}/>;
      case 'package-form': return <PackageFormScreen nav={nav}/>;
      case 'course-form': return <CourseFormScreen nav={nav}/>;
      case 'achievement-form': return <AchievementFormScreen nav={nav}/>;
      case 'child-form': return <ChildFormScreen nav={nav}/>;
      default: return <div style={{padding:24, color:'var(--text-3)'}}>页面开发中...</div>;
    }
  };

  return (
    <div className="ios-wrap">
      <div className="ios-screen" style={{background:'var(--bg)'}}>
        <div className="ios-island"/>
        <div className="ios-status" style={{color:'#000'}}>
          <span style={{fontSize:15, fontWeight:600}}>9:41</span>
          <div style={{display:'flex', alignItems:'center', gap:6}}>
            <div style={{display:'flex', alignItems:'flex-end', gap:1.5, height:11}}>
              {[4,6,9,11].map((h,i) => <div key={i} style={{width:3, height:h, background:'currentColor', borderRadius:1}}/>)}
            </div>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor"/><path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round"/><path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" opacity=".7"/></svg>
            <div style={{width:25, height:11, border:'1.5px solid currentColor', borderRadius:3, padding:1, position:'relative'}}>
              <div style={{width:'85%', height:'100%', background:'currentColor', borderRadius:1}}/>
              <div style={{position:'absolute', top:3, right:-3, width:2, height:5, background:'currentColor', borderRadius:'0 1px 1px 0'}}/>
            </div>
          </div>
        </div>
        <div className="ios-content">
          <div key={key} className={isTab ? '' : 'page-enter'} style={{height:'100%'}}>
            {renderScreen()}
          </div>
        </div>
        <div className="ios-home"/>
        {/* Modal overlay */}
        {modal === 'record' && <RecordModal nav={nav} courseId={params.courseId}/>}
        {modal === 'photo-viewer' && <PhotoViewer nav={nav} photoId={params.photoId}/>}
      </div>
    </div>
  );
}
